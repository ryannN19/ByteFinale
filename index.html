<!--
  ============================================================
  BYTE FINALE — HOW TO UPDATE TASKS
  ============================================================
  1. Press Ctrl+F (or Cmd+F on Mac) and search for: EDIT TASKS HERE

  3. To add an image to a task's popup, add an "image" field
     with the image URL or file path (see step-by-step guide

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Byte Finale</title>
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('https://fonts.gstatic.com/s/pressstart2p/v15/e3t4euO8T-267oIAQAu6jDQyK3nVivM.woff2') format('woff2');
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #a3cbe7;
      background-image:
        repeating-linear-gradient(to bottom, transparent, transparent 34px, rgba(21, 83, 156, 0.18) 35px),
        linear-gradient(180deg, #b7d7ef 0%, #a3cbe7 40%, #8fbde0 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px 14px 48px;
      position: relative;
      overflow-x: hidden;
    }

    .margin-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 34px;
      width: 2px;
      background: rgba(178, 60, 60, 0.25);
    }

    .wrap {
      max-width: 420px;
      margin: 0 auto;
      position: relative;
    }

    .starburst {
      position: absolute;
      top: -18px;
      right: -6px;
      width: 88px;
      height: 88px;
      opacity: 0.9;
      z-index: 0;
    }

    header {
      position: relative;
      text-align: center;
      padding: 22px 10px 18px;
      z-index: 1;
    }

    .eyebrow {
      display: inline-block;
      background: #15539c;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 3px;
      transform: rotate(-2deg);
      margin-bottom: 14px;
      box-shadow: 2px 2px 0 rgba(21, 83, 156, 0.35);
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 30px;
      line-height: 1.3;
      color: #6a3b28;
      margin: 0;
      letter-spacing: -1px;
      text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.4);
    }

    h1 .finale {
      color: #15539c;
    }

    .subtext {
      font-size: 13px;
      color: #2c5a86;
      margin-top: 12px;
      font-weight: 600;
    }

    .grid-wrap {
      display: grid;
      grid-template-columns: 20px 1fr;
      gap: 6px;
      position: relative;
      z-index: 1;
    }

    .col-labels {
      grid-column: 2;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 4px;
    }

    .row-labels {
      display: grid;
      grid-template-rows: repeat(5, 1fr);
      gap: 6px;
    }

    .axis-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #15539c;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      position: relative;
      z-index: 1;
    }

    .box {
      aspect-ratio: 1 / 1;
      background: #f6f4ec;
      border: 2px solid #15539c;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: pointer;
      box-shadow: 2px 2px 0 rgba(21, 83, 156, 0.3);
      padding: 2px;
      -webkit-tap-highlight-color: transparent;
    }

    .box:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 rgba(21, 83, 156, 0.3);
    }

    .box.mixed {
      background: #eaf6ff;
      border-color: #38b6ff;
    }

    .box-count {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: #15539c;
      line-height: 1.2;
    }

    .box-unit {
      font-size: 8px;
      color: #6489b6;
      font-weight: 700;
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    .countdown {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 4px 0 20px;
    }

    .countdown-box {
      background: #15539c;
      border-radius: 4px;
      padding: 8px 6px;
      min-width: 52px;
      text-align: center;
      box-shadow: 2px 2px 0 rgba(21, 83, 156, 0.3);
    }

    .countdown-num {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      color: #ffffff;
      line-height: 1.2;
    }

    .countdown-unit {
      font-size: 9px;
      color: #cfe4f7;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .countdown-label {
      text-align: center;
      font-size: 12px;
      color: #2c5a86;
      font-weight: 700;
      margin: -6px 0 10px;
      position: relative;
      z-index: 1;
    }

    .countdown.done .countdown-box {
      background: #38b6ff;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
      font-size: 11px;
      color: #2c5a86;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      border: 2px solid #15539c;
      background: #f6f4ec;
    }

    .legend-swatch.mixed {
      border-color: #38b6ff;
      background: #eaf6ff;
    }

    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 11px;
      color: #3d6690;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    footer .brand {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #6a3b28;
      display: block;
      margin-bottom: 6px;
    }

    .big-alert {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 100vh;
      background: rgba(21, 40, 66, 0.75);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .big-alert.show {
      display: flex;
    }

    .big-alert-box {
      background: #15539c;
      border: 4px solid #38b6ff;
      border-radius: 10px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 6px 6px 0 rgba(21, 83, 156, 0.5);
      max-width: 340px;
    }

    .big-alert-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 22px;
      line-height: 1.5;
      color: #ffffff;
      margin: 0 0 20px;
    }

    .big-alert-close {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      background: #ffffff;
      color: #15539c;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      cursor: pointer;
    }

    .overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 100vh;
      background: rgba(21, 40, 66, 0.55);
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      background: #fdfbf5;
      border: 3px solid #38b6ff;
      border-radius: 8px;
      max-width: 320px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px 20px 18px;
      position: relative;
      box-shadow: 5px 5px 0 rgba(21, 83, 156, 0.4);
    }

    .modal-tag {
      display: inline-block;
      background: #38b6ff;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 3px;
      transform: rotate(-2deg);
      margin-bottom: 12px;
    }

    .modal-tag.mixed {
      background: #15539c;
    }

    .modal-task {
      font-size: 17px;
      font-weight: 700;
      color: #2c2c2a;
      margin: 0 0 12px;
      line-height: 1.35;
    }

    .modal-task-body {
      font-size: 13px;
      font-weight: 400;
      color: #2c2c2a;
      margin: 0 0 12px;
      line-height: 1.5;
    }

    .modal-task-reminder {
      font-size: 13px;
      font-weight: 400;
      color: #c0392b;
      margin: 0 0 12px;
      line-height: 1.5;
    }

    .modal-image {
      width: 100%;
      border-radius: 6px;
      margin: 0 0 14px;
      display: block;
      border: 2px solid #b8c9dc;
    }

    .modal-image-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 0 0 14px;
    }
    
    .modal-image-grid img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 6px;
      border: 2px solid #b8c9dc;
    }

    .modal-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 6px 0;
      border-top: 1px dashed #b8c9dc;
      font-size: 13px;
    }

    .modal-row:first-of-type {
      border-top: none;
    }

    .modal-label {
      color: #6489b6;
      font-weight: 700;
      min-width: 78px;
      flex-shrink: 0;
    }

    .modal-value {
      color: #15539c;
      font-weight: 600;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #15539c;
      color: #ffffff;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>
  <div class="margin-line"></div>
  <div class="wrap">
    <svg class="starburst" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,0 58,38 96,32 64,54 80,90 50,68 20,90 36,54 4,32 42,38" fill="#5c8fc4" opacity="0.55" />
    </svg>

    <header>
      <span class="eyebrow">closing session</span>
      <h1>byte<span class="finale"> finale</span></h1>
      <p class="subtext">Tap a box to view the task</p>
    </header>

    <p class="countdown-label" id="countdownLabel">Byte Finale — 45 min timer</p>
    <div class="countdown" id="countdown">
      <div class="countdown-box countdown-timer"><div class="countdown-num" id="cd-mins">45</div><div class="countdown-unit">min</div></div>
      <div class="countdown-box countdown-timer"><div class="countdown-num" id="cd-secs">00</div><div class="countdown-unit">sec</div></div>
    </div>

    <div class="grid-wrap">
      <div></div>
      <div class="col-labels" id="colLabels"></div>
      <div class="row-labels" id="rowLabels"></div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="legend-swatch"></span>Same team</div>
      <div class="legend-item"><span class="legend-swatch mixed"></span>Mixed teams</div>
    </div>

    <footer>
      <span class="brand">byte buddies</span>
      presented to you by SOIT Monash Malaysia
    </footer>

    <div class="overlay" id="overlay">
      <div class="modal" id="modal"></div>
    </div>

    <div class="big-alert" id="bigAlert">
      <div class="big-alert-box">
        <p class="big-alert-text" id="bigAlertText"></p>
        <button class="big-alert-close" id="bigAlertClose">OK</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    //  EDIT TASKS HERE
    //  Update the 25 boxes below with real task details once decided.
    //  headcount: minimum number of people needed to complete the task
    //             (shown on the box itself, e.g. "3" means 3 or more,
    //             or "-" if there is no minimum headcount)
    //  task: the challenge description
    //  location: where on campus the task takes place
    //  mixed: true if members from different teams can combine to
    //          meet the headcount, false if same-team only
    //  image: OPTIONAL — a URL or relative file path to an image
    //         shown inside the popup. Leave this field out entirely
    //         if the task has no image.
    // ============================================================

    const tasks = [
      // Box 1 (Row 1, Col 1) — vA
      { headcount: "-", task: "Webpage Hunt</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Go to Student Hub, use a computer there, and click through any links on monash.edu until you reach the target page (picture shown below).</p><p class=\"modal-task-body\"><strong>Submission:</strong> Take a physical photo of the screen with your team present, then submit at the Marking Station.", location: "Student Hub", mixed: false, image: "webpage-hunt-clue.png" },      
      // Box 2 (Row 1, Col 2)
      { headcount: "-", task: "Who Am I?</p><p class=\"modal-task-body\"><strong>Instruction:</strong> You'll be shown a partial/cropped image of a celebrity's face, one at a time.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Correctly guess all 7 celebrities to pass and receive the prop token.", location: "Sky Terrace", mixed: false },      
      // Box 3 (Row 1, Col 3)
      { headcount: "-", task: "Where Am I? (1)</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Look at the photo shown below of a specific campus location. Figure out where it is and travel there. No hints given — rely on your own knowledge of campus.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Take a selfie/group photo with the location clearly shown in the background — a photo of the landmark alone, with no team members in it, does not count.", location: "Anywhere", mixed: false, image: "WHERE_AM_I_1.jpeg" },
      // Box 4 (Row 1, Col 4)
      { headcount: "8", task: "Hoop Duel</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Team up 4v4 with another team. Race through a hula hoop trail — when both teams meet at a hoop, settle it with rock-paper-scissors before continuing.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Complete the trail first to win. Only the winning team receives the prop token; the losing team does not.</p><p class=\"modal-task-reminder\"><strong>Reminder:</strong> This task can only be completed if two teams are present — a lone team cannot attempt it.", location: "Field", mixed: true },
      // Box 5 (Row 1, Col 5)
      { headcount: "8", task: "Hoop Duel</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Team up 4v4 with another team. Race through a hula hoop trail — when both teams meet at a hoop, settle it with rock-paper-scissors before continuing.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Complete the trail first to win. Only the winning team receives the prop token; the losing team does not.</p><p class=\"modal-task-reminder\"><strong>Reminder:</strong> This task can only be completed if two teams are present — a lone team cannot attempt it.", location: "Field", mixed: true },

      // Box 6 (Row 2, Col 1)
      { headcount: "8", task: "Book Hunt</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Team up with another team. NPC will give both teams the same 3 book titles to find in the library. Race to be the first to correctly bring back 2 out of the 3 books — NPC will only tell you if each book is correct or incorrect.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Be the first team to correctly return 2 out of 3 books. Only the winning team receives the prop token; the losing team does not.</p><p class=\"modal-task-reminder\"><strong>Reminder:</strong> This task can only be completed if two teams are present — a lone team cannot attempt it.", location: "Library (L3 Discussion Zone)", mixed: true },
      // Box 7 (Row 2, Col 2)
      { headcount: "4", task: "Stranger Squad Photo</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Find another group of 4 random people/strangers anywhere on campus who are not part of any Byte Buddies team.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Take a group photo with your team together with the 4 strangers — both groups must be clearly visible in the same photo.", location: "Anywhere", mixed: false },
      // Box 8 (Row 2, Col 3)
      { headcount: "-", task: "Algorithm Hunt</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Locate 3 code snippets written on the whiteboard at Lepak Place. Trace through each code and work out the correct output.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Take a photo of yourself with the whiteboard showing all 3 code snippets, then state the correct outputs at the Marking Station.", location: "Lepak Place", mixed: false },
      // Box 9 (Row 2, Col 4)
      { headcount: "-", task: "SOIT Subcomm Chameleon</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Search around LT4108 to locate 5 out of 8 SOIT subcomm cutouts placed around the area.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Take a photo with each of the 5 cutouts you find — your team must be visible in every photo, a photo of the cutout alone does not count. Submit all photos together as a set at the Marking Station.", location: "LT4108", mixed: false },
      // Box 10 (Row 2, Col 5)
      { headcount: "-", task: "Guess the Price</p><p class=\"modal-task-body\"><strong>Instruction:</strong> NPC will show you drinks one at a time, each from a different brand. For each drink, discuss with your team and give one final price guess as a group — no individual guessing. A guess is correct if it falls within RM1.00 of the actual price.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Get 3 correct guesses in total to pass and receive the prop token.", location: "Lepak Place", mixed: false },

      // Box 11 (Row 3, Col 1)
      { headcount: "-", task: "Muted Moments</p><p class=\"modal-task-body\"><strong>Instruction:</strong> NPC will play short movie clips with the audio muted at a key line of dialogue. Discuss with your team and give one final guess as to what the muted line says.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Get 3 correct guesses in total to pass and receive the prop token.", location: "ALC 6427", mixed: false },
      // Box 12 (Row 3, Col 2)
      { headcount: "-", task: "UNO Memory Match</p><p class=\"modal-task-body\"><strong>Instruction:</strong> 16 UNO cards are laid face-down in a grid. Flip 2 cards at a time to find matching pairs (same number and color). If a match is found, the pair is kept aside; if not, both cards are flipped back face-down.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Match all 16 cards (8 pairs) within 1 minute to pass and receive the prop token.", location: "Student Lounge", mixed: false },
      // Box 13 (Row 3, Col 3 — CENTER, hardest box, sits on both diagonals)
      { headcount: "8", task: "Musical Chair</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Team up with another team. 8 players start with 7 seats. NPC plays music — when it stops, everyone finds a seat. Whoever is left standing is eliminated, and one more seat is removed each round.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Continue until every player from one team has been eliminated — the remaining team wins and receives the prop token.</p><p class=\"modal-task-reminder\"><strong>Reminder:</strong> This task can only be completed if two teams are present — a lone team cannot attempt it.", location: "Foyer", mixed: true },
      // Box 14 (Row 3, Col 4)
      { headcount: "4", task: "Human \"M-O-N-A-S-H\"</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Go to the Monash landmark sign shown below and pose in front of it across the letters (M-O-N-A-S-H). You must follow the reference poses shown below for each letter.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Take a photo showing at least 4 members posing in front of the landmark, then submit at the Marking Station.", location: "Monash Landmark (Main Gate)", mixed: false, images: ["monash_landmark.jpg", "M.jpg", "O.jpg", "N.jpg", "A.jpg", "S.jpg", "H.jpg"] },
      // Box 15 (Row 3, Col 5)
      { headcount: "-", task: "Where Am I? (2)</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Look at the photo shown below of a specific campus location. Figure out where it is and travel there.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Take a selfie/group photo with the location clearly shown in the background — a photo of the landmark alone, with no team members in it, does not count.", location: "Anywhere", mixed: false, image: "WHERE_AM_I_2.jpeg" },

      // Box 16 (Row 4, Col 1)
      { headcount: "4", task: "We-Fie 2.0</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Search around Oasis to find a hidden reference photo showing a specific pose. Once found, recreate the same pose as closely as possible in your own group photo at the same location.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Take your recreated group photo and submit it at the Marking Station.", location: "Oasis", mixed: false },
      // Box 17 (Row 4, Col 2)
      { headcount: "-", task: "Animal Expedition</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Find the kangaroo plushie hidden somewhere in the Building 5 Basement.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Take a group photo with the plushie clearly shown — your team must be visible in the photo, a photo of the plushie alone does not count.", location: "Building 5 Basement", mixed: false },
      // Box 18 (Row 4, Col 3)
      { headcount: "5", task: "Placeholder task 18 — details coming soon", location: "Badminton Court Foyer", mixed: false },
      // Box 19 (Row 4, Col 4)
      { headcount: "-", task: "Where Am I? (3)</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Look at the photo shown below of a specific campus location. Figure out where it is and travel there.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Take a selfie/group photo with the location clearly shown in the background — a photo of the landmark alone, with no team members in it, does not count.", location: "Anywhere", mixed: false, image: "WHERE_AM_I_3.jpeg" },
      // Box 20 (Row 4, Col 5)
      { headcount: "8", task: "Guess the Song</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Team up with another team. NPC will play short audio clips of songs. Hit the bell as soon as you recognize the song — once you hit the bell, you must answer immediately, no discussion allowed. If you're wrong, the other team gets a chance to hit the bell and guess on the same clip.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Be the first team to reach 5 correct guesses. Only the winning team receives the prop token; the losing team does not.</p><p class=\"modal-task-reminder\"><strong>Reminder:</strong> This task can only be completed if two teams are present — a lone team cannot attempt it.", location: "Badminton Court", mixed: true },

      // Box 21 (Row 5, Col 1)
      { headcount: "-", task: "Monash Chameleon 2.0</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Search around The Hive to find 5 out of 8 clay figurines hidden around the area.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Take a photo with each of the 5 figurines you find — you must be visible in every photo, a photo of the figurine alone does not count. Submit all 5 photos together as a set at the Marking Station.", location: "The Hive", mixed: false },
      // Box 22 (Row 5, Col 2)
      { headcount: "8", task: "Relay Timer</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Team up with another team. Your team uses one stopwatch, kept hidden so it cannot be seen while running. All 4 members take turns starting and stopping the timer, in any order and for any duration — relying purely on feel, no peeking at the timer.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Once your team decides to stop, the final accumulated time is revealed. The team whose time is closest to exactly 30 seconds wins and receives the prop token.</p><p class=\"modal-task-reminder\"><strong>Reminder:</strong> This task can only be completed if two teams are present — a lone team cannot attempt it.", location: "The Hive", mixed: true },
      // Box 23 (Row 5, Col 3)
      { headcount: "4", task: "World Cup</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Your team takes 4 penalty shots — one shot per member.</p><p class=\"modal-task-body\"><strong>Submission:</strong> All 4 members must score their shot to pass and receive the prop token.", location: "Field", mixed: false },
      // Box 24 (Row 5, Col 4)
      { headcount: "-", task: "Coffee Addict</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Find and photograph at least 7 different coffee machines anywhere on campus.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Take a photo with each machine — your team must be visible in every photo, a photo of the machine alone does not count. Submit all 7 photos together as a set at the Marking Station.", location: "Anywhere", mixed: false },
      // Box 25 (Row 5, Col 5)
      { headcount: "-", task: "NPC Collector</p><p class=\"modal-task-body\"><strong>Instruction:</strong> Take individual photos with 6 different existing NPCs stationed at other task locations around campus. You don't need to complete their actual task — a quick photo is enough. You can split up to cover different NPCs faster.</p><p class=\"modal-task-body\"><strong>Submission:</strong> Submit all 6 photos together as a set at the Marking Station.", location: "Anywhere", mixed: false },
    ];

    // ============================================================
    //  STOP EDITING HERE — nothing below this line needs to change
    // ============================================================

    const colLetters = ['A', 'B', 'C', 'D', 'E'];
    const rowLetters = ['v', 'w', 'x', 'y', 'z'];

    const colLabelsEl = document.getElementById('colLabels');
    colLetters.forEach(l => {
      const el = document.createElement('div');
      el.className = 'axis-label';
      el.textContent = l;
      colLabelsEl.appendChild(el);
    });

    const rowLabelsEl = document.getElementById('rowLabels');
    rowLetters.forEach(l => {
      const el = document.createElement('div');
      el.className = 'axis-label';
      el.textContent = l;
      rowLabelsEl.appendChild(el);
    });

    const grid = document.getElementById('grid');
    const overlay = document.getElementById('overlay');
    const modal = document.getElementById('modal');

    tasks.forEach((t, i) => {
      const box = document.createElement('div');
      box.className = 'box' + (t.mixed ? ' mixed' : '');
      box.innerHTML =
        '<span class="box-count">' + t.headcount + '</span>' +
        '<span class="box-unit">min. people</span>';
      box.addEventListener('click', () => openModal(t));
      grid.appendChild(box);
    });

    function openModal(t) {
      const mixedNote = t.mixed
        ? '<div class="modal-row"><span class="modal-label">Mixed rule</span><span class="modal-value">Min. 4 people from one team — 2 teams is enough to complete this</span></div>'
        : '';
      const imageBlock = t.images
        ? '<div class="modal-image-grid">' + t.images.map(img => '<img src="' + img + '" alt="Task reference image">').join('') + '</div>'
        : (t.image
          ? '<img class="modal-image" src="' + t.image + '" alt="Task reference image">'
          : '');
      modal.innerHTML =
        '<button class="modal-close" id="closeBtn" aria-label="Close">&#10005;</button>' +
        '<div class="modal-tag' + (t.mixed ? ' mixed' : '') + '">' + (t.mixed ? 'mixed teams' : 'same team') + '</div>' +
        '<p class="modal-task">' + t.task + '</p>' +
        imageBlock +
        '<div class="modal-row"><span class="modal-label">Min. headcount</span><span class="modal-value">' + t.headcount + ' people</span></div>' +
        '<div class="modal-row"><span class="modal-label">Location</span><span class="modal-value">' + t.location + '</span></div>' +
        mixedNote;
      overlay.classList.add('show');
      document.getElementById('closeBtn').addEventListener('click', closeModal);
    }

    function closeModal() {
      overlay.classList.remove('show');
    }

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });

    // ============================================================
    //  45-MINUTE GAME TIMER — DATE-BASED, SYNCED ACROSS ALL PHONES
    //  Everyone's page counts down toward the same real-world
    //  clock time, so no "start button" or backend is needed —
    //  every device independently agrees on the same countdown.
    //
    //  SEGMENT_START: when the Byte Finale segment begins.
    //  The timer shows a static 45:00 until this moment, then
    //  automatically starts counting down on every device at once.
    // ============================================================
    const SEGMENT_START = new Date("2026-08-06T18:15:00+08:00");
    const TIMER_SECONDS = 45 * 60;
    const SEGMENT_END = new Date(SEGMENT_START.getTime() + TIMER_SECONDS * 1000);

    let hasEnded = false;

    const countdownLabel = document.getElementById('countdownLabel');
    const countdownEl = document.getElementById('countdown');
    const cdMins = document.getElementById('cd-mins');
    const cdSecs = document.getElementById('cd-secs');

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function renderTime(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      cdMins.textContent = pad(mins);
      cdSecs.textContent = pad(secs);
    }

    function tick() {
      const now = new Date();

      if (now < SEGMENT_START) {
        countdownLabel.textContent = "Byte Finale starts at 6:15 PM";
        renderTime(TIMER_SECONDS);
        return;
      }

      const remainingMs = SEGMENT_END - now;

      if (remainingMs <= 0) {
        renderTime(0);
        if (!hasEnded) {
          hasEnded = true;
          finishTimer("Time's up!!! Please return to Badminton Court!");
        }
        return;
      }

      countdownLabel.textContent = "Byte Finale — time remaining";
      countdownEl.classList.remove('done');
      renderTime(Math.ceil(remainingMs / 1000));
    }

    const bigAlert = document.getElementById('bigAlert');
    const bigAlertText = document.getElementById('bigAlertText');
    const bigAlertClose = document.getElementById('bigAlertClose');

    function showBigAlert(message) {
      bigAlertText.textContent = message;
      bigAlert.classList.add('show');
    }

    bigAlertClose.addEventListener('click', () => {
      bigAlert.classList.remove('show');
    });

    function finishTimer(message) {
      clearInterval(mainInterval);
      countdownEl.classList.add('done');
      countdownLabel.textContent = message;
      showBigAlert(message);
    }

    tick();
    const mainInterval = setInterval(tick, 1000);
  </script>
</body>

</html>
